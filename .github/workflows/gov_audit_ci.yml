name: Government Accountability & Corruption Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-all-audit-engines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Core Compliance Audit Engine
        run: |
          python core_audit_engine.py

      - name: Execute Dual-Ledger Tactical Deceit Engine
        run: |
          python dual_ledger_tacticaldeciet.py

      - name: Execute Systemic Corruption & Expenditure Watchdog Blueprint
        run: |
          python corruption_blueprint.py

      - name: Execute Whistleblower Provenance Vault Engine
        run: |
          python whistleblower_provenance_vault.py

      - name: Execute Regulatory Feed Parser Engine
        run: |
          python regulatory_feed_parser.py

      - name: Execute Sovereign Archive Export Utility
        run: |
          python export_vault_archive.py

      - name: Verify All Audit Reports & Archives Generated
        run: |
          echo "[*] Checking generated reports and archives..."
          if [ -f "reports/government_accountability_audit_report.md" ] && \
             [ -f "reports/dual_ledger_deceit_analysis.md" ] && \
             [ -f "reports/systemic_corruption_financial_flows_report.md" ] && \
             [ -f "reports/whistleblower_provenance_audit_log.md" ] && \
             [ -f "reports/regulatory_feed_ingestion_report.md" ]; then
            echo "[+] SUCCESS: All five sovereign audit reports generated successfully."
          else
            echo "[-] ERROR: One or more audit reports are missing!"
            exit 1
          fi

      - name: Upload Complete Sovereign Audit Artifacts & Vaults
        uses: actions/upload-artifact@v4
        with:
          name: canadian-sovereign-audit-export
          path: |
            reports/*.md
            data/*.db
            archives/*.zip
            archives/*.json
          retention-days: 90
