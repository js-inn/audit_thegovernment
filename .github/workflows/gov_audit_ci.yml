name: Government Accountability & Corruption Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-all-audit-engines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Core Compliance Audit Engine
        run: |
          python core_audit_engine.py

      - name: Execute Dual-Ledger Tactical Deceit Engine
        run: |
          python dual_ledger_tacticaldeciet.py

      - name: Execute Systemic Corruption & Expenditure Watchdog Blueprint
        run: |
          python corruption_blueprint.py

      - name: Verify All Audit Reports Generated
        run: |
          echo "[*] Checking generated reports..."
          if [ -f "reports/government_accountability_audit_report.md" ] && \
             [ -f "reports/dual_ledger_deceit_analysis.md" ] && \
             [ -f "reports/systemic_corruption_financial_flows_report.md" ]; then
            echo "[+] SUCCESS: All three sovereign audit reports generated successfully."
          else
            echo "[-] ERROR: One or more audit reports are missing!"
            exit 1
          fi

      - name: Upload Complete Audit Artifacts & Vaults
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-audit-vault-artifacts
          path: |
            reports/*.md
            data/*.db
          retention-days: 90
